<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe Starter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Tic-Tac-Toe</h1>
      </header>

      <!-- Game Status & Reset -->
      <section class="status-panel">
        <div id="status-message" class="status-message">Player X's Turn</div>
        <input
          type="range"
          id="size"
          name="size"
          min="2"
          max="10"
          value="3"
          step="1"
        />
        <p>Board Size: <span id="slider-value">3</span></p>
        <p>
          Gamemode: <b><span id="gamemode">Human vs Human</span></b>
        </p>
        <button id="ai-btn-e" class="btn">Easy AI</button>
        <button id="ai-btn-h" class="btn">Hard AI</button>
        <button id="human-btn" class="btn" hidden>Play Against Human</button>
        <button id="reset-btn" class="btn">Start Game</button>
      </section>

      <!-- Main Game Board Container -->
      <!-- The 9 grid cells will be dynamically generated by JavaScript! -->
      <main class="board-container">
        <div id="board" class="board">
          <!-- JS will populate cells here -->
        </div>
      </main>
    </div>

    <script src="ai.js"></script>
    <script src="app.js"></script>
  </body>
</html>
